name: Deploy no GitHub Pages

# Todo push na master (ou main) gera um build estático e publica no Pages.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Permissões mínimas exigidas pelo deploy-pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        # Sem `enablement: true` de propósito: essa opção tenta criar o site do
        # Pages pela API e exige permissão de admin, o que derruba o run.
        # O Pages precisa ser ativado uma vez em Settings -> Pages ->
        # Build and deployment -> Source -> GitHub Actions.

      - name: Instalar dependências
        run: npm ci

      - name: Build (export estático)
        run: npm run build
        env:
          # /cyberpunkrp-interactivecards — vem do configure-pages, sem chumbar.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
